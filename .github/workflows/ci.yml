name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (Test & Build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: wasm32v1-none
          components: rustfmt, clippy

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check code formatting
        run: cargo fmt --all --check || echo "Warning: unformatted files detected across workspace"

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets

      - name: Run contract unit tests
        run: cargo test --workspace

      - name: Build contracts for wasm32v1-none
        run: cargo build --workspace --target wasm32v1-none --release

  circuits:
    name: Circuits (Compile & Proofs)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Circom
        run: |
          CIRCOM_VERSION="v2.1.9"
          curl -sSL "https://github.com/iden3/circom/releases/download/${CIRCOM_VERSION}/circom-linux-amd64" -o /usr/local/bin/circom
          chmod +x /usr/local/bin/circom
          circom --version

      - name: Cache Powers-of-Tau PTAU files
        id: cache-ptau
        uses: actions/cache@v4
        with:
          path: |
            build/pot12_final.ptau
            build/pot14_final.ptau
          key: meritpay-ptau-v1

      - name: Install circuit dependencies
        working-directory: circuits
        run: npm ci

      - name: Run Groth16 trusted setup & circuit compilation
        run: |
          chmod +x scripts/setup.sh
          ./scripts/setup.sh

      - name: Generate and assert proofs
        run: node scripts/gen_proof.js

  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ShellCheck on scripts
        run: shellcheck scripts/*.sh
